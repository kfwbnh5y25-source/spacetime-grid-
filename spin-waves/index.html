<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Spin Waves — Eigenmodes &amp; Parametric Excitation</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03060d; color: #ebf3ff; font: 12px/1.4 system-ui,-apple-system,sans-serif; }
  canvas#fieldCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #topHud { position: fixed; z-index: 6; top: max(14px,env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: none; width: min(820px, calc(100vw - 24px)); }
  .hudPill { padding: 6px 11px; border: 1px solid rgba(190,220,255,.2); border-radius: 99px; background: rgba(4,9,18,.74); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font: 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .09em; color: rgba(235,245,255,.88); white-space: nowrap; }
  .hudPill.warn { border-color: rgba(255,200,95,.55); color: #ffd479; }
  .hudPill.active { border-color: rgba(110,225,175,.55); color: #8af0c4; }
  #controlsPanel { position: fixed; z-index: 8; top: max(54px,calc(env(safe-area-inset-top) + 42px)); right: max(14px,env(safe-area-inset-right)); width: min(316px,calc(100vw - 28px)); max-height: calc(100vh - 130px); overflow-y: auto; border: 1px solid rgba(190,220,255,.2); border-radius: 14px; background: rgba(5,10,20,.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #controlsPanel summary { list-style: none; cursor: pointer; padding: 10px 12px; font: 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .14em; color: rgba(225,238,255,.85); }
  #controlsPanel summary::-webkit-details-marker { display: none; }
  #controlsPanel[open] summary { border-bottom: 1px solid rgba(190,220,255,.12); }
  .ctrlBody { padding: 11px 12px 12px; display: grid; gap: 10px; }
  .sectionLabel { font: 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .12em; color: rgba(185,212,245,.62); text-transform: uppercase; }
  .btnRow { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { min-height: 28px; padding: 5px 9px; border: 1px solid rgba(190,220,255,.22); border-radius: 8px; background: rgba(120,165,225,.13); color: #eef5ff; font: 10px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .04em; cursor: pointer; }
  .btn.active { background: rgba(105,175,255,.32); border-color: rgba(165,215,255,.65); color: #fff; }
  .sliderRow { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; align-items: center; font: 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; color: rgba(220,235,255,.78); }
  .sliderRow output { color: #fff; font-variant-numeric: tabular-nums; }
  .sliderRow input { grid-column: 1 / -1; width: 100%; accent-color: #8ec5ff; margin: 0; }
  #readoutsDock { position: fixed; z-index: 7; left: max(14px,env(safe-area-inset-left)); bottom: max(16px,env(safe-area-inset-bottom)); display: grid; gap: 8px; width: min(310px,calc(100vw - 145px)); pointer-events: none; }
  .readoutCard { padding: 8px 10px; border: 1px solid rgba(190,220,255,.2); border-radius: 12px; background: rgba(5,10,20,.78); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .specTitle { display: flex; justify-content: space-between; font: 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .1em; color: rgba(215,232,255,.75); margin-bottom: 5px; }
  canvas#specCanvas { display: block; width: 100%; height: 54px; }
  .modeBars { display: grid; gap: 4px; }
  .modeRow { display: grid; grid-template-columns: 74px 1fr 34px; gap: 6px; align-items: center; font: 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color: rgba(220,235,255,.8); }
  .modeTrack { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .modeFill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg,#68b5ff,#9cf0ff); transition: width .08s linear; }
  #backBtn { position: fixed; z-index: 9; right: max(14px,env(safe-area-inset-right)); bottom: max(16px,env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border: 1px solid rgba(190,220,255,.28); border-radius: 20px; background: rgba(6,12,24,.76); color: rgba(235,245,255,.94); font: 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .12em; text-decoration: none; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #backBtn:hover { background: rgba(30,54,90,.82); border-color: rgba(165,210,255,.55); }
  @media (pointer:coarse) {
    #controlsPanel { top: auto; bottom: max(62px,calc(env(safe-area-inset-bottom) + 52px)); max-height: 44vh; }
    #readoutsDock { width: min(230px,calc(100vw - 140px)); }
    .modeRow { grid-template-columns: 60px 1fr 28px; }
  }
</style>
</head>
<body>
<canvas id="fieldCanvas" aria-label="2D Spin wave eigenmode and parametric excitation simulation. Tap or drag to pluck spin waves."></canvas>
<div id="topHud">
  <div class="hudPill" id="modeBadge">PARAMETRIC PUMPING</div>
  <div class="hudPill" id="threshBadge">h_p / h_th: 1.00</div>
  <div class="hudPill active" id="domModeBadge">DOMINANT MODE: (0,0)</div>
</div>
<details id="controlsPanel" open>
  <summary>SPIN WAVE &amp; EIGENMODE CONTROLS ▾</summary>
  <div class="ctrlBody">
    <div class="sectionLabel">Excitation Regimes</div>
    <div class="btnRow">
      <button class="btn active" id="presetParam" type="button">Parametric 2f_k</button>
      <button class="btn" id="presetSub" type="button">Below Thresh</button>
      <button class="btn" id="presetDirect" type="button">Direct RF</button>
    </div>
    <div class="sectionLabel">Launch / Inspect Eigenmode (n,m)</div>
    <div class="btnRow" id="eigenButtons">
      <button class="btn" data-mode="0" type="button">(0,0) Kittel</button>
      <button class="btn" data-mode="1" type="button">(1,0) Radial</button>
      <button class="btn" data-mode="2" type="button">(0,1) Dipole</button>
      <button class="btn" data-mode="3" type="button">(0,2) Quad</button>
      <button class="btn" data-mode="4" type="button">(1,1) Mixed</button>
      <button class="btn" data-mode="5" type="button">(2,0) 2-Ring</button>
    </div>
    <div class="btnRow">
      <button class="btn active" id="geomDisk" type="button">Circular Disk</button>
      <button class="btn" id="geomRect" type="button">Rectangular Film</button>
    </div>
    <div class="btnRow">
      <button class="btn active" id="driveParallel" type="button">Parallel Pump (x)</button>
      <button class="btn" id="driveTransverse" type="button">Transverse RF (y)</button>
    </div>
    <label class="sliderRow">
      <span>Drive Frequency f</span><output id="outFreq">5.80 GHz</output>
      <input id="slFreq" type="range" min="1.5" max="11.0" step="0.05" value="5.80">
    </label>
    <label class="sliderRow">
      <span>Drive Amplitude h_p</span><output id="outAmp">0.180</output>
      <input id="slAmp" type="range" min="0" max="0.45" step="0.005" value="0.180">
    </label>
    <label class="sliderRow">
      <span>Bias Field H_0 (x)</span><output id="outField">0.45</output>
      <input id="slField" type="range" min="0.15" max="1.20" step="0.01" value="0.45">
    </label>
    <label class="sliderRow">
      <span>Gilbert Damping α</span><output id="outDamp">0.018</output>
      <input id="slDamp" type="range" min="0.004" max="0.080" step="0.002" value="0.018">
    </label>
    <div class="btnRow">
      <button class="btn" id="btnPause" type="button">Pause</button>
      <button class="btn" id="btnSeed" type="button">Re-seed</button>
      <button class="btn" id="btnClear" type="button">Calm Spins</button>
    </div>
  </div>
</details>
<div id="readoutsDock">
  <div class="readoutCard" id="modesBox">
    <div class="specTitle"><span>LIVE EIGENMODES</span><span id="ampTotal">⟨|m_⊥|⟩: 0.000</span></div>
    <div class="modeBars" id="modeBars"></div>
  </div>
  <div class="readoutCard" id="spectrumBox">
    <div class="specTitle"><span>MAGNON SPECTRUM</span><span id="specPeak">f_peak: —</span></div>
    <canvas id="specCanvas" width="280" height="54"></canvas>
  </div>
</div>
<a id="backBtn" href="../">← SPACETIME</a>
<script>
(() => {
  'use strict';
  const NX = 64, NY = 64, N = NX * NY;
  const mx = new Float32Array(N), my = new Float32Array(N), mz = new Float32Array(N);
  const kx1 = new Float32Array(N), ky1 = new Float32Array(N), kz1 = new Float32Array(N);
  const mxT = new Float32Array(N), myT = new Float32Array(N), mzT = new Float32Array(N);
  const activeMask = new Uint8Array(N);

  const offCanvas = document.createElement('canvas');
  offCanvas.width = NX; offCanvas.height = NY;
  const offCtx = offCanvas.getContext('2d');
  const imgData = offCtx.createImageData(NX, NY);

  const fieldCanvas = document.getElementById('fieldCanvas');
  const ctx = fieldCanvas.getContext('2d', { alpha: false });
  const specCanvas = document.getElementById('specCanvas');
  const specCtx = specCanvas.getContext('2d');

  let geometryMode = 'disk';
  let driveMode = 'parallel';
  let driveFreq = 5.80;
  let driveAmp = 0.22;
  let biasH0 = 0.45;
  let damping = 0.018;
  let paused = false;
  let simTime = 0;

  const J_EX = 14.0;
  const DEMAG_NZ = 1.60;
  const FREQ_TO_RAD = 0.355; // f_kittel(H0=0.45) ≈ 2.71 GHz, 2*f_k ≈ 5.42 GHz

  // Exact free-boundary (Neumann J_m'(alpha)=0) disk modes and rectangular modes
  const MODE_SPECS = [
    { label: '(0,0) Kittel', rectLabel: '(0,0) Unif', m: 0, alpha: 0.0, nx: 0, ny: 0 },
    { label: '(0,1) Dipole', rectLabel: '(1,0) Mode', m: 1, alpha: 1.8412, nx: 1, ny: 0 },
    { label: '(0,2) Quad',   rectLabel: '(1,1) Cross', m: 2, alpha: 3.0542, nx: 1, ny: 1 },
    { label: '(1,0) Radial', rectLabel: '(2,0) 2-Node', m: 0, alpha: 3.8317, nx: 2, ny: 0 },
    { label: '(1,1) Mixed',  rectLabel: '(2,1) Mode', m: 1, alpha: 5.3314, nx: 2, ny: 1 },
    { label: '(2,0) 2-Ring', rectLabel: '(2,2) Mode', m: 0, alpha: 7.0156, nx: 2, ny: 2 }
  ];
  const modeTemplates = MODE_SPECS.map(() => new Float32Array(N));
  const modeAmps = new Float32Array(MODE_SPECS.length);

  function besselJ(n, x) {
    let sum = 0, factK = 1, factNK = 1;
    for (let i = 2; i <= n; i++) factNK *= i;
    const halfX = 0.5 * x;
    for (let k = 0; k < 18; k++) {
      if (k > 0) { factK *= k; factNK *= (n + k); }
      const term = ((k & 1) ? -1 : 1) * Math.pow(halfX, 2 * k + n) / (factK * factNK);
      sum += term;
      if (Math.abs(term) < 1e-12) break;
    }
    return sum;
  }

  const SPEC_LEN = 128;
  const probeSeries = new Float32Array(SPEC_LEN);
  let probeHead = 0, frameCounter = 0;
  const spectrum = new Float32Array(SPEC_LEN / 2);

  function buildMaskAndModes() {
    const cx = (NX - 1) * 0.5, cy = (NY - 1) * 0.5, R = NX * 0.45, r2Max = R * R;
    for (let y = 0; y < NY; y++) {
      for (let x = 0; x < NX; x++) {
        const idx = y * NX + x;
        if (geometryMode === 'disk') {
          const dx = x - cx, dy = y - cy;
          activeMask[idx] = (dx * dx + dy * dy <= r2Max) ? 1 : 0;
        } else {
          activeMask[idx] = 1;
        }
      }
    }
    for (let m = 0; m < MODE_SPECS.length; m++) {
      const spec = MODE_SPECS[m];
      const tpl = modeTemplates[m];
      let normSq = 0;
      for (let y = 0; y < NY; y++) {
        for (let x = 0; x < NX; x++) {
          const i = y * NX + x;
          if (!activeMask[i]) { tpl[i] = 0; continue; }
          let v = 0;
          if (geometryMode === 'disk') {
            const dx = (x - cx) / R, dy = (y - cy) / R, r = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
            v = spec.alpha === 0 ? 1 : besselJ(spec.m, spec.alpha * r) * Math.cos(spec.m * th);
          } else {
            const u = (x + 0.5) / NX, w = (y + 0.5) / NY;
            v = Math.cos(spec.nx * Math.PI * u) * Math.cos(spec.ny * Math.PI * w);
          }
          tpl[i] = v;
          normSq += v * v;
        }
      }
      const inv = 1 / Math.sqrt(Math.max(1e-8, normSq));
      for (let i = 0; i < N; i++) tpl[i] *= inv;
    }
    const barsEl = document.getElementById('modeBars');
    barsEl.innerHTML = MODE_SPECS.map((s, idx) => {
      const name = geometryMode === 'disk' ? s.label : s.rectLabel;
      return `<div class="modeRow"><span>${name}</span><div class="modeTrack"><div class="modeFill" id="mf${idx}"></div></div><span id="mv${idx}">0.00</span></div>`;
    }).join('');
    document.querySelectorAll('#eigenButtons button').forEach((btn, idx) => {
      btn.textContent = geometryMode === 'disk' ? MODE_SPECS[idx].label : MODE_SPECS[idx].rectLabel;
    });
  }

  function modeFreqGHz(mIdx) {
    const spec = MODE_SPECS[mIdx];
    const R = NX * 0.45;
    const k2 = geometryMode === 'disk'
      ? (spec.alpha / R) * (spec.alpha / R)
      : Math.pow((spec.nx * Math.PI) / NX, 2) + Math.pow((spec.ny * Math.PI) / NY, 2);
    const hEff = biasH0 + J_EX * k2;
    const omega = Math.sqrt(hEff * (hEff + DEMAG_NZ));
    return omega / FREQ_TO_RAD;
  }

  function seedSpins(amp = 0.02) {
    if (!amp) {
      for (let i = 0; i < N; i++) { mx[i] = 1; my[i] = 0; mz[i] = 0; }
      return;
    }
    const scale = amp * 28;
    for (let i = 0; i < N; i++) {
      if (!activeMask[i]) { mx[i] = 1; my[i] = 0; mz[i] = 0; continue; }
      const ny = scale * (0.6 * modeTemplates[1][i] + 0.5 * modeTemplates[2][i] + 0.4 * modeTemplates[3][i] + 0.3 * modeTemplates[4][i]);
      const nz = ny * 0.25;
      const inv = 1 / Math.hypot(1, ny, nz);
      mx[i] = inv; my[i] = ny * inv; mz[i] = nz * inv;
    }
  }

  function exciteEigenmode(mIdx) {
    const tpl = modeTemplates[mIdx];
    let maxT = 1e-6;
    for (let i = 0; i < N; i++) if (Math.abs(tpl[i]) > maxT) maxT = Math.abs(tpl[i]);
    const scale = 0.26 / maxT;
    for (let i = 0; i < N; i++) {
      if (!activeMask[i]) { mx[i] = 1; my[i] = 0; mz[i] = 0; continue; }
      const ny = tpl[i] * scale;
      const nz = 0;
      const inv = 1 / Math.hypot(1, ny, nz);
      mx[i] = inv; my[i] = ny * inv; mz[i] = 0;
    }
    driveMode = 'transverse';
    driveFreq = modeFreqGHz(mIdx);
    driveAmp = mIdx === 0 ? 0.04 : 0.0;
    document.querySelectorAll('#eigenButtons button').forEach((b, i) => b.classList.toggle('active', i === mIdx));
    syncUi();
  }

  function computeLlgDerivatives(sx, sy, sz, outX, outY, outZ, t) {
    const omega = driveFreq * FREQ_TO_RAD;
    const driveVal = driveAmp * Math.cos(omega * t);
    const hxExt = biasH0 + (driveMode === 'parallel' ? driveVal : 0);
    const hyExt = driveMode === 'transverse' ? driveVal : 0;
    const invNorm = 1 / (1 + damping * damping);

    for (let y = 0; y < NY; y++) {
      const ym = y > 0 ? y - 1 : y, yp = y < NY - 1 ? y + 1 : y;
      for (let x = 0; x < NX; x++) {
        const i = y * NX + x;
        if (!activeMask[i]) { outX[i] = 0; outY[i] = 0; outZ[i] = 0; continue; }
        const xm = x > 0 ? x - 1 : x, xp = x < NX - 1 ? x + 1 : x;

        const mxi = sx[i], myi = sy[i], mzi = sz[i];
        let lx = 0, ly = 0, lz = 0;
        const nL = y * NX + xm, nR = y * NX + xp, nU = ym * NX + x, nD = yp * NX + x;
        if (activeMask[nL]) { lx += sx[nL] - mxi; ly += sy[nL] - myi; lz += sz[nL] - mzi; }
        if (activeMask[nR]) { lx += sx[nR] - mxi; ly += sy[nR] - myi; lz += sz[nR] - mzi; }
        if (activeMask[nU]) { lx += sx[nU] - mxi; ly += sy[nU] - myi; lz += sz[nU] - mzi; }
        if (activeMask[nD]) { lx += sx[nD] - mxi; ly += sy[nD] - myi; lz += sz[nD] - mzi; }

        const hx = hxExt + J_EX * lx;
        const hy = hyExt + J_EX * ly;
        const hz = -DEMAG_NZ * mzi + J_EX * lz;

        const cx = myi * hz - mzi * hy;
        const cy = mzi * hx - mxi * hz;
        const cz = mxi * hy - myi * hx;

        const ddx = myi * cz - mzi * cy;
        const ddy = mzi * cx - mxi * cz;
        const ddz = mxi * cy - myi * cx;

        outX[i] = -(cx + damping * ddx) * invNorm;
        outY[i] = -(cy + damping * ddy) * invNorm;
        outZ[i] = -(cz + damping * ddz) * invNorm;
      }
    }
  }

  function stepLlg(dt) {
    computeLlgDerivatives(mx, my, mz, kx1, ky1, kz1, simTime);
    for (let i = 0; i < N; i++) {
      if (!activeMask[i]) continue;
      let tx = mx[i] + kx1[i] * dt, ty = my[i] + ky1[i] * dt, tz = mz[i] + kz1[i] * dt;
      const inv = 1 / (Math.hypot(tx, ty, tz) || 1);
      mxT[i] = tx * inv; myT[i] = ty * inv; mzT[i] = tz * inv;
    }
    computeLlgDerivatives(mxT, myT, mzT, mxT, myT, mzT, simTime + dt);
    for (let i = 0; i < N; i++) {
      if (!activeMask[i]) continue;
      let nx = mx[i] + 0.5 * (kx1[i] + mxT[i]) * dt;
      let ny = my[i] + 0.5 * (ky1[i] + myT[i]) * dt;
      let nz = mz[i] + 0.5 * (kz1[i] + mzT[i]) * dt;
      const inv = 1 / (Math.hypot(nx, ny, nz) || 1);
      mx[i] = nx * inv; my[i] = ny * inv; mz[i] = nz * inv;
    }
    simTime += dt;
  }

  function parametricThreshold() {
    const omegaK = Math.sqrt(biasH0 * (biasH0 + DEMAG_NZ));
    return Math.max(0.005, (4 * damping * omegaK) / DEMAG_NZ);
  }

  function pluckAt(clientX, clientY) {
    const size = Math.min(width, height) * 0.68;
    const x0 = (width - size) * 0.5, y0 = (height - size) * 0.5;
    const gx = Math.floor(((clientX - x0) / size) * NX);
    const gy = Math.floor(((clientY - y0) / size) * NY);
    if (gx < 0 || gx >= NX || gy < 0 || gy >= NY) return;
    for (let y = Math.max(0, gy - 4); y <= Math.min(NY - 1, gy + 4); y++) {
      for (let x = Math.max(0, gx - 4); x <= Math.min(NX - 1, gx + 4); x++) {
        const i = y * NX + x;
        if (!activeMask[i]) continue;
        const d2 = (x - gx) * (x - gx) + (y - gy) * (y - gy);
        const kick = 0.28 * Math.exp(-d2 / 5.5);
        const ny = my[i] + kick, nz = mz[i] + kick * 0.5;
        const inv = 1 / Math.hypot(mx[i], ny, nz);
        mx[i] *= inv; my[i] = ny * inv; mz[i] = nz * inv;
      }
    }
  }

  let width = 0, height = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth; height = window.innerHeight;
    fieldCanvas.width = Math.round(width * dpr);
    fieldCanvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  let pluckDown = false;
  fieldCanvas.addEventListener('pointerdown', e => { pluckDown = true; pluckAt(e.clientX, e.clientY); });
  fieldCanvas.addEventListener('pointermove', e => { if (pluckDown) pluckAt(e.clientX, e.clientY); });
  window.addEventListener('pointerup', () => { pluckDown = false; });

  function updateSpectrum() {
    frameCounter++;
    if (frameCounter % 11 !== 0) return;
    const idx = Math.floor(NY * 0.36) * NX + Math.floor(NX * 0.38);
    probeSeries[probeHead] = my[idx] + 0.6 * mz[idx];
    probeHead = (probeHead + 1) % SPEC_LEN;

    const dtSample = 11 * 12 * 0.005; // 0.66 sim-time units
    const fsGHz = (2 * Math.PI) / (FREQ_TO_RAD * dtSample); // ~26.82 GHz

    let maxVal = 1e-6, peakBin = 1;
    for (let k = 1; k < SPEC_LEN / 2; k++) {
      let re = 0, im = 0;
      const w = (2 * Math.PI * k) / SPEC_LEN;
      for (let n = 0; n < SPEC_LEN; n++) {
        const s = probeSeries[(probeHead + n) % SPEC_LEN];
        const hann = 0.5 * (1 - Math.cos((2 * Math.PI * n) / (SPEC_LEN - 1)));
        re += s * hann * Math.cos(w * n);
        im -= s * hann * Math.sin(w * n);
      }
      const p = Math.sqrt(re * re + im * im);
      spectrum[k] = p;
      if (p > maxVal) { maxVal = p; peakBin = k; }
    }
    const sw = specCanvas.width, sh = specCanvas.height;
    specCtx.clearRect(0, 0, sw, sh);
    specCtx.fillStyle = 'rgba(130,185,255,0.08)';
    specCtx.fillRect(0, 0, sw, sh);

    const maxFreq = 12.5;
    const xFp = (driveFreq / maxFreq) * sw;
    const xHalf = ((driveFreq * 0.5) / maxFreq) * sw;
    specCtx.strokeStyle = 'rgba(255,205,95,0.6)';
    specCtx.setLineDash([3, 3]);
    specCtx.beginPath(); specCtx.moveTo(xHalf, 0); specCtx.lineTo(xHalf, sh); specCtx.stroke();
    specCtx.strokeStyle = 'rgba(255,130,175,0.45)';
    specCtx.beginPath(); specCtx.moveTo(xFp, 0); specCtx.lineTo(xFp, sh); specCtx.stroke();
    specCtx.setLineDash([]);

    specCtx.strokeStyle = '#7cd4ff';
    specCtx.lineWidth = 1.6;
    specCtx.beginPath();
    for (let k = 1; k < SPEC_LEN / 2; k++) {
      const f = (k / SPEC_LEN) * fsGHz;
      if (f > maxFreq) break;
      const x = (f / maxFreq) * sw;
      const y = sh - 4 - (spectrum[k] / maxVal) * (sh - 10);
      if (k === 1) specCtx.moveTo(x, y); else specCtx.lineTo(x, y);
    }
    specCtx.stroke();
    const fPeak = (peakBin / SPEC_LEN) * fsGHz;
    document.getElementById('specPeak').textContent = 'f_peak: ' + fPeak.toFixed(2) + ' GHz';
  }

  function updateEigenmodeReadout(meanAmp) {
    let domIdx = 0, domVal = -1, totalModeSq = 0;
    for (let m = 0; m < MODE_SPECS.length; m++) {
      const tpl = modeTemplates[m];
      let dotY = 0, dotZ = 0;
      for (let i = 0; i < N; i++) {
        if (!activeMask[i]) continue;
        dotY += my[i] * tpl[i];
        dotZ += mz[i] * tpl[i];
      }
      const amp = Math.hypot(dotY, dotZ);
      modeAmps[m] = amp;
      totalModeSq += amp * amp;
      if (amp > domVal) { domVal = amp; domIdx = m; }
    }
    const norm = Math.sqrt(Math.max(1e-8, totalModeSq));
    for (let m = 0; m < MODE_SPECS.length; m++) {
      const frac = Math.min(1, modeAmps[m] / norm);
      const fill = document.getElementById('mf' + m);
      const val = document.getElementById('mv' + m);
      if (fill) fill.style.width = (frac * 100).toFixed(0) + '%';
      if (val) val.textContent = frac.toFixed(2);
    }
    const domName = geometryMode === 'disk' ? MODE_SPECS[domIdx].label : MODE_SPECS[domIdx].rectLabel;
    document.getElementById('domModeBadge').textContent = `MODE: ${domName}`;
    document.getElementById('ampTotal').textContent = `⟨|m_⊥|⟩: ${meanAmp.toFixed(3)}`;
  }

  function drawScene() {
    const data = imgData.data;
    let ampSum = 0, activeCount = 0;
    for (let i = 0; i < N; i++) {
      const o = i * 4;
      if (!activeMask[i]) {
        data[o] = 3; data[o + 1] = 6; data[o + 2] = 13; data[o + 3] = 255;
        continue;
      }
      activeCount++;
      const vy = my[i], vz = mz[i];
      ampSum += Math.hypot(vy, vz);
      const val = Math.max(-1, Math.min(1, vy * 2.8));
      const p = Math.max(0, val), n = Math.max(0, -val), phase = Math.min(1, Math.abs(vz) * 2.4);
      data[o] = Math.round(14 + p * 235 + phase * 45);
      data[o + 1] = Math.round(22 + p * 120 + n * 165);
      data[o + 2] = Math.round(42 + n * 213 + phase * 55);
      data[o + 3] = 255;
    }
    offCtx.putImageData(imgData, 0, 0);

    ctx.fillStyle = '#03060d';
    ctx.fillRect(0, 0, width, height);
    const size = Math.min(width, height) * 0.68;
    const x0 = (width - size) * 0.5, y0 = (height - size) * 0.5;
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offCanvas, x0, y0, size, size);
    ctx.strokeStyle = 'rgba(180,215,255,0.28)';
    ctx.lineWidth = 1.5;
    if (geometryMode === 'disk') {
      ctx.beginPath(); ctx.arc(width * 0.5, height * 0.5, size * 0.45, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.strokeRect(x0, y0, size, size);
    }

    ctx.strokeStyle = 'rgba(240,248,255,0.42)';
    ctx.lineWidth = 1;
    const step = 4, cell = size / NX;
    ctx.beginPath();
    for (let y = 2; y < NY; y += step) {
      for (let x = 2; x < NX; x += step) {
        const i = y * NX + x;
        if (!activeMask[i]) continue;
        const sx = x0 + (x + 0.5) * cell, sy = y0 + (y + 0.5) * cell;
        const ax = my[i] * cell * 6.5, ay = -mz[i] * cell * 6.5;
        ctx.moveTo(sx, sy); ctx.lineTo(sx + ax, sy + ay);
      }
    }
    ctx.stroke();
    ctx.restore();

    const meanAmp = activeCount ? ampSum / activeCount : 0;
    const hTh = parametricThreshold();
    const ratio = driveMode === 'parallel' ? driveAmp / hTh : 0;
    const modeBadge = document.getElementById('modeBadge');
    const threshBadge = document.getElementById('threshBadge');
    modeBadge.textContent = driveMode === 'parallel'
      ? `PARAMETRIC PUMP · f_p=${driveFreq.toFixed(2)} (2f_0≈${(2 * modeFreqGHz(0)).toFixed(2)})`
      : `TRANSVERSE RF · f_rf=${driveFreq.toFixed(2)} (f_0≈${modeFreqGHz(0).toFixed(2)})`;
    threshBadge.textContent = driveMode === 'parallel'
      ? `h_p / h_th: ${ratio.toFixed(2)}${ratio > 1.02 ? ' · INSTABILITY' : ' · DAMPED'}`
      : 'DIRECT RESONANCE';
    threshBadge.classList.toggle('warn', driveMode === 'parallel' && ratio > 1.02);
    threshBadge.classList.toggle('active', driveMode === 'transverse');
    updateEigenmodeReadout(meanAmp);
  }

  function syncUi() {
    document.getElementById('slFreq').value = driveFreq;
    document.getElementById('outFreq').textContent = driveFreq.toFixed(2) + ' GHz';
    document.getElementById('slAmp').value = driveAmp;
    document.getElementById('outAmp').textContent = driveAmp.toFixed(3);
    document.getElementById('slField').value = biasH0;
    document.getElementById('outField').textContent = biasH0.toFixed(2);
    document.getElementById('slDamp').value = damping;
    document.getElementById('outDamp').textContent = damping.toFixed(3);
    document.getElementById('geomDisk').classList.toggle('active', geometryMode === 'disk');
    document.getElementById('geomRect').classList.toggle('active', geometryMode === 'rect');
    document.getElementById('driveParallel').classList.toggle('active', driveMode === 'parallel');
    document.getElementById('driveTransverse').classList.toggle('active', driveMode === 'transverse');
  }

  function applyPreset(name) {
    document.querySelectorAll('#presetParam,#presetSub,#presetDirect,#eigenButtons button').forEach(b => b.classList.remove('active'));
    if (name === 'param') {
      document.getElementById('presetParam').classList.add('active');
      driveMode = 'parallel'; biasH0 = 0.45; damping = 0.018; driveFreq = 2 * modeFreqGHz(3); driveAmp = 0.28;
      seedSpins(0.03);
    } else if (name === 'sub') {
      document.getElementById('presetSub').classList.add('active');
      driveMode = 'parallel'; biasH0 = 0.45; damping = 0.025; driveFreq = 2 * modeFreqGHz(3); driveAmp = 0.04;
      seedSpins(0.02);
    } else if (name === 'direct') {
      document.getElementById('presetDirect').classList.add('active');
      driveMode = 'transverse'; biasH0 = 0.45; damping = 0.018; driveFreq = modeFreqGHz(1); driveAmp = 0.055;
      seedSpins(0.006);
    }
    syncUi();
  }

  document.getElementById('presetParam').addEventListener('click', () => applyPreset('param'));
  document.getElementById('presetSub').addEventListener('click', () => applyPreset('sub'));
  document.getElementById('presetDirect').addEventListener('click', () => applyPreset('direct'));
  document.getElementById('eigenButtons').addEventListener('click', e => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    document.querySelectorAll('#presetParam,#presetSub,#presetDirect').forEach(b => b.classList.remove('active'));
    exciteEigenmode(Number(btn.dataset.mode));
  });
  document.getElementById('geomDisk').addEventListener('click', () => { geometryMode = 'disk'; buildMaskAndModes(); seedSpins(0.025); syncUi(); });
  document.getElementById('geomRect').addEventListener('click', () => { geometryMode = 'rect'; buildMaskAndModes(); seedSpins(0.025); syncUi(); });
  document.getElementById('driveParallel').addEventListener('click', () => { driveMode = 'parallel'; syncUi(); });
  document.getElementById('driveTransverse').addEventListener('click', () => { driveMode = 'transverse'; syncUi(); });
  document.getElementById('slFreq').addEventListener('input', e => { driveFreq = +e.target.value; syncUi(); });
  document.getElementById('slAmp').addEventListener('input', e => { driveAmp = +e.target.value; syncUi(); });
  document.getElementById('slField').addEventListener('input', e => { biasH0 = +e.target.value; syncUi(); });
  document.getElementById('slDamp').addEventListener('input', e => { damping = +e.target.value; syncUi(); });
  document.getElementById('btnPause').addEventListener('click', e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; });
  document.getElementById('btnSeed').addEventListener('click', () => seedSpins(0.035));
  document.getElementById('btnClear').addEventListener('click', () => seedSpins(0.0));

  buildMaskAndModes();
  applyPreset('param');

  function frame() {
    if (!paused) {
      for (let s = 0; s < 12; s++) stepLlg(0.005);
      updateSpectrum();
    }
    drawScene();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
