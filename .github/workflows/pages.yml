name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("index.html", "/tmp/site.js"),
              ("feedback-lab/index.html", "/tmp/feedback.js"),
          ]:
              html = Path(source).read_text()
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"Expected one inline script in {source}, found {len(scripts)}")
              Path(target).write_text(scripts[0])
          PY
          node --check /tmp/site.js
          node --check /tmp/feedback.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
