<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spacetime">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Spacetime — Interactive Grid</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { touch-action: none; }
  canvas {
    display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gpuCanvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .planet-cursor { position:fixed; z-index:4; left:0; top:0; width:18px; height:18px; border-radius:50%; pointer-events:none; opacity:0; will-change:transform; background:radial-gradient(circle at 32% 27%,#fff 0%,#b9d9ff 13%,#547da9 43%,#182d49 76%,#080f1b 100%); box-shadow:0 0 7px 2px rgba(154,202,255,.35),inset -3px -2px 5px rgba(0,0,0,.65); transition:opacity .12s ease; }
  .planet-cursor::after { content:""; position:absolute; width:27px; height:8px; left:-5px; top:5px; border:1px solid rgba(190,220,255,.8); border-radius:50%; transform:rotate(-24deg); box-shadow:0 0 4px rgba(150,200,255,.45); }
  .planet-cursor.visible { opacity:1; }
  canvas { transform-origin:50% 50%; will-change:transform; backface-visibility:hidden; }
  #gestureStatus { position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 10px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.72);font:10px/1.3 ui-monospace,monospace;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s; }
  #gestureStatus.visible { opacity:1; }
  #resetViewButton { display:none; }
  @media (pointer:coarse) {
    #resetViewButton { display:flex; position:fixed; z-index:6; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right)); align-items:center; justify-content:center; width:42px; height:42px; padding:0; border:1px solid rgba(255,255,255,.24); border-radius:50%; background:rgba(8,12,20,.62); color:rgba(245,248,255,.9); font:24px/1 system-ui,sans-serif; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    #resetViewButton:active { background:rgba(120,150,195,.35); transform:scale(.94); }
  }
  #gyroButton { display:none; }
  @media (pointer:coarse) {
    #gyroButton { display:flex; position:fixed; z-index:6; top:max(14px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); align-items:center; justify-content:center; min-width:42px; height:42px; padding:0 12px; border:1px solid rgba(255,255,255,.24); border-radius:22px; background:rgba(8,12,20,.62); color:rgba(245,248,255,.9); font:11px/1 system-ui,sans-serif; letter-spacing:.04em; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    #gyroButton.active { border-color:rgba(160,205,255,.75); background:rgba(50,85,130,.58); }
  }
  @media (prefers-reduced-motion: reduce) { .planet-cursor,.hint,#gestureStatus { transition:none; } }
  @media (hover:hover) and (pointer:fine) { canvas { cursor:none; } }
  .hint {
    position: fixed; z-index: 3; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%); color: rgba(255,255,255,.42);
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .22em; text-transform: uppercase; white-space: nowrap;
    pointer-events: none; transition: opacity 1.2s ease;
  }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="universe" aria-label="Interactive curved spacetime grid. Move or touch to bend the grid."></canvas>
<canvas id="gpuCanvas" aria-hidden="true"></canvas>
<div class="hint" id="hint">move · touch · explore</div>
<div class="planet-cursor" id="planetCursor" aria-hidden="true"></div>
<div id="gestureStatus" aria-live="polite"></div>
<button id="resetViewButton" type="button" aria-label="Reset view" title="Reset view">↺</button>
<button id="gyroButton" type="button" aria-pressed="false">TILT MASSES</button>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const gpuCanvas=document.getElementById('gpuCanvas');
  const gl=gpuCanvas.getContext('webgl2',{alpha:true,antialias:true,desynchronized:true,powerPreference:'high-performance'});
  let gpuProgram=null,gpuVertexBuffer=null,gpuIndexBuffer=null,gpuIndexCount=0,gpuError=null;
  const MAX_GPU_POINTERS=10;
  const hint = document.getElementById('hint');
  const planetCursor = document.getElementById('planetCursor');
  const gestureStatus=document.getElementById('gestureStatus');
  const persistentMasses=[];
  let viewScale=1,viewX=0,viewY=0,viewRotation=0,paused=false,pauseTime=0,longPressTimer=0,longPressPointer=null,adaptiveDprCap=matchMedia('(pointer:coarse)').matches?1.5:2,slowFrames=0,smoothFrames=0;
  const storageKey='spacetime-grid-state-v1';
  let cameraAnimationRaf=0,cameraAnimationTarget=null,cameraAnimationLast=0;
  function worldPoint(x,y){const dx=x-width/2-viewX,dy=y-height/2-viewY,a=viewRotation*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);return {x:(dx*c+dy*sn)/viewScale+width/2,y:(-dx*sn+dy*c)/viewScale+height/2};}
  function applyView(){const v='translate('+viewX+'px,'+viewY+'px) rotate('+viewRotation+'deg) scale('+viewScale+')';canvas.style.transform=v;gpuCanvas.style.transform=v;}
  function stopCameraAnimation(){if(cameraAnimationRaf)cancelAnimationFrame(cameraAnimationRaf);cameraAnimationRaf=0;cameraAnimationTarget=null;cameraAnimationLast=0;}
  function animateCameraTo(target){
    cameraAnimationTarget={viewX:target.viewX,viewY:target.viewY,viewScale:target.viewScale,viewRotation:target.viewRotation};
    if(cameraAnimationRaf)return;
    cameraAnimationLast=performance.now();
    const tick=now=>{
      const dt=Math.min(50,Math.max(1,now-cameraAnimationLast));cameraAnimationLast=now;
      const t=cameraAnimationTarget;
      if(!t){cameraAnimationRaf=0;return;}
      const blend=1-Math.exp(-dt/88);
      viewX+=(t.viewX-viewX)*blend;viewY+=(t.viewY-viewY)*blend;
      viewScale+=(t.viewScale-viewScale)*blend;viewRotation+=(t.viewRotation-viewRotation)*blend;
      const settled=Math.abs(t.viewX-viewX)<.08&&Math.abs(t.viewY-viewY)<.08&&
        Math.abs(t.viewScale-viewScale)<.0005&&Math.abs(t.viewRotation-viewRotation)<.015;
      if(settled){
        viewX=t.viewX;viewY=t.viewY;viewScale=t.viewScale;viewRotation=t.viewRotation;
        cameraAnimationRaf=0;cameraAnimationTarget=null;cameraAnimationLast=0;applyView();saveState();return;
      }
      applyView();cameraAnimationRaf=requestAnimationFrame(tick);
    };
    cameraAnimationRaf=requestAnimationFrame(tick);
  }
  function updateCameraTarget(patch){
    const base=cameraAnimationTarget||{viewX,viewY,viewScale,viewRotation};
    animateCameraTo({...base,...patch});
  }
  function showStatus(m){gestureStatus.textContent=m;gestureStatus.classList.add('visible');clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>gestureStatus.classList.remove('visible'),1300);}
  function saveState(){const state={viewScale,viewX,viewY,viewRotation};try{localStorage.setItem(storageKey,JSON.stringify(state));}catch(_){}try{const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(state))));history.replaceState(null,'',location.pathname+location.search+'#state='+encoded);}catch(_){}}
  function restoreState(){try{const hash=new URLSearchParams(location.hash.slice(1)).get('state');const d=hash?JSON.parse(decodeURIComponent(escape(atob(hash)))):JSON.parse(localStorage.getItem(storageKey)||'null');if(d){viewScale=Math.max(.7,Math.min(2.5,d.viewScale||1));viewX=Number(d.viewX)||0;viewY=Number(d.viewY)||0;viewRotation=Number(d.viewRotation)||0;}}catch(_){}}
  function resetView(){persistentMasses.length=0;updateCameraTarget({viewScale:1,viewX:0,viewY:0,viewRotation:0});showStatus('VIEW RESET');}
  const gyroButton=document.getElementById('gyroButton');
  let gyroEnabled=false,gyroBaseline=null,gyroTargetX=0,gyroTargetY=0,gyroX=0,gyroY=0,gyroListener=null;
  function handleDeviceOrientation(e){
    if(!gyroEnabled||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    if(!gyroBaseline){gyroBaseline={beta:e.beta,gamma:e.gamma};return;}
    const db=Math.max(-35,Math.min(35,e.beta-gyroBaseline.beta));
    const dg=Math.max(-35,Math.min(35,e.gamma-gyroBaseline.gamma));
    gyroTargetX=dg*2.2;
    gyroTargetY=db*2.2;
  }
  async function toggleGyro(){
    if(gyroEnabled){
      gyroEnabled=false;gyroBaseline=null;gyroTargetX=gyroTargetY=gyroX=gyroY=0;
      if(gyroListener)window.removeEventListener('deviceorientation',gyroListener);
      gyroListener=null;gyroButton.classList.remove('active');gyroButton.setAttribute('aria-pressed','false');gyroButton.textContent='TILT MASSES';showStatus('TILT CONTROL OFF');return;
    }
    try{
      const Orientation=window.DeviceOrientationEvent;
      if(!Orientation){showStatus('MOTION SENSOR UNAVAILABLE');return;}
      if(typeof Orientation.requestPermission==='function'){
        const permission=await Orientation.requestPermission();
        if(permission!=='granted'){showStatus('MOTION PERMISSION DENIED');return;}
      }
      gyroEnabled=true;gyroBaseline=null;gyroTargetX=gyroTargetY=gyroX=gyroY=0;
      gyroListener=handleDeviceOrientation;
      window.addEventListener('deviceorientation',gyroListener,{passive:true});
      gyroButton.classList.add('active');gyroButton.setAttribute('aria-pressed','true');gyroButton.textContent='TILT ON';
      showStatus('HOLD STILL TO CALIBRATE');
    }catch(_){showStatus('MOTION SENSOR UNAVAILABLE');}
  }
  gyroButton.addEventListener('click',toggleGyro);
  document.getElementById('resetViewButton').addEventListener('click',()=>{
    stopInertia();gestureBase=null;panBase=null;trackpadGestureBase=null;lastTouchSample=null;
    for(const [id,p] of pointers){if(p.pointerType==='touch'){p.life=0;p.targetStrength=0;p.down=false;}}
    resetView();
  });
  restoreState();
  const pointers = new Map();
  const fields = [];
  const starfield = new Image();
  const background = document.createElement('canvas');
  const bgctx = background.getContext('2d', { alpha: false });
  const benchMode = new URLSearchParams(location.search).has('bench');
  const benchParams = new URLSearchParams(location.search);
  let requestedDpr = [1,1.5,1.75,2,2.5,3].includes(Number(benchParams.get('dpr'))) ? Number(benchParams.get('dpr')) : 3;
  let frameCap = [60,120].includes(Number(benchParams.get('cap'))) ? Number(benchParams.get('cap')) : 120;
  let testLabel = benchParams.get('test') || 'unlabelled';
  const perf = {
    started: performance.now(), firstFrame: null, imageStart: performance.now(),
    imageLoad: null, imageBytes: null, samples: [], dropped: 0, baselineFrameMs: null, frames: 0,
    renderMs: [], lastReport: 0, longTasks: 0, maxFrameMs: 0, frameLog: []
  };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const gaussian = new Float32Array(2049);
  for (let i = 0; i < gaussian.length; i++) gaussian[i] = Math.exp(-i * 8 / (gaussian.length - 1));
  let width=0, height=0, dpr=1, last=0, elapsed=0, hintTimer, raf=0, lastFrame=0;
  let inv2Sigma2=0, rayMargin=0, geometry=null, imageStatus='loading';
  const spacing = () => Math.max(30, Math.min(48, Math.round(Math.min(width,height)/17)));

  function initGpu(){
    if(!gl)return false;
    const vs=`#version 300 es
precision highp float;
layout(location=0) in vec2 a_xy;
layout(location=1) in vec2 a_t0;
layout(location=2) in vec2 a_t1;
layout(location=3) in vec2 a_t2;
layout(location=4) in vec2 a_t3;
layout(location=5) in vec2 a_t4;
layout(location=6) in vec2 a_other;
layout(location=7) in vec2 a_o0;
layout(location=8) in vec2 a_o1;
layout(location=9) in vec2 a_o2;
layout(location=10) in vec2 a_o3;
layout(location=11) in vec2 a_o4;
layout(location=12) in float a_side;
layout(location=13) in float a_end;
uniform vec2 u_resolution;
uniform float u_inv2Sigma2;
uniform vec2 u_pointer[10];
uniform float u_rS[10];
uniform int u_pointerCount;
uniform float u_rayMargin;
uniform float u_softening;
uniform vec2 u_phase[5];
out float v_edge;

// Weak-field GR in isotropic coordinates: n_opt ~= 1 - 2 Phi/c^2.
// For Phi=-GM/sqrt(r^2+eps^2), a null ray obeys
// d^2 x_perp/ds^2 ~= r_s * b / ((s-q)^2+b^2+eps^2)^(3/2),
// where r_s=2GM/c^2. This is its analytic first-order (Born) integral.
float lensIntegral(float s,float q,float b2){
 float v1=s-q,v0=-q;
 float root1=sqrt(v1*v1+b2),root0=sqrt(v0*v0+b2);
 float f1=v1/(b2*root1),f0=v0/(b2*root0);
 return max(0.0,(s-q)*(f1-f0)+(1.0/root1-1.0/root0));
}
vec2 warp(vec2 pA,vec2 pB,float endpoint,vec2 t0,vec2 t1,vec2 t2,vec2 t3,vec2 t4){
 vec2 p=mix(pA,pB,endpoint);
 vec2 direction=normalize(pB-pA);
 bool horizontal=abs(direction.x)>abs(direction.y);
 vec2 origin=horizontal?vec2(-u_rayMargin,p.y):vec2(p.x,-u_rayMargin);
 float s=max(0.0,dot(p-origin,direction));
 vec2 normal=vec2(-direction.y,direction.x);
 vec2 displacement=vec2(0.0);
 for(int i=0;i<10;i++){
  if(i>=u_pointerCount)break;
  vec2 rel=u_pointer[i]-origin;
  float q=dot(rel,direction),b=dot(rel,normal);
  float b2=b*b+u_softening*u_softening;
  displacement+=normal*(u_rS[i]*b*lensIntegral(s,q,b2));
 }
 p+=displacement;
 float wx=5.5*(t0.x*u_phase[0].y+t0.y*u_phase[0].x)+2.8*(t1.x*u_phase[1].y-t1.y*u_phase[1].x);
 float wy=5.5*(t2.x*u_phase[2].y-t2.y*u_phase[2].x)+2.8*(t3.x*u_phase[3].y+t3.y*u_phase[3].x);
 float br=1.5*(t4.x*u_phase[4].y+t4.y*u_phase[4].x);
 return p+vec2(wx,wy+br);
}
void main(){
 vec2 p0=warp(a_xy,a_other,0.0,a_t0,a_t1,a_t2,a_t3,a_t4);
 vec2 p1=warp(a_xy,a_other,1.0,a_o0,a_o1,a_o2,a_o3,a_o4);
 vec2 tangent=normalize(p1-p0);
 vec2 normal=vec2(-tangent.y,tangent.x);
 vec2 p=mix(p0,p1,a_end)+tangent*(a_end*2.0-1.0)*0.35+normal*a_side*1.2;
 gl_Position=vec4(2.0*p.x/u_resolution.x-1.0,1.0-2.0*p.y/u_resolution.y,0.0,1.0);
 v_edge=a_side;
}`;
    const fs=`#version 300 es
precision mediump float;
in float v_edge;
out vec4 color;
void main(){float edge=abs(v_edge);float aa=max(fwidth(edge),0.001);float coverage=1.0-smoothstep(1.0-aa,1.0+aa,edge);color=vec4(.94,.97,1.0,.64*coverage);}`;
    const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};
    try{const v=compile(gl.VERTEX_SHADER,vs),f=compile(gl.FRAGMENT_SHADER,fs);gpuProgram=gl.createProgram();gl.attachShader(gpuProgram,v);gl.attachShader(gpuProgram,f);gl.linkProgram(gpuProgram);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(gpuProgram,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(gpuProgram));gpuVertexBuffer=gl.createBuffer();gpuIndexBuffer=gl.createBuffer();gl.useProgram(gpuProgram);gl.enable(gl.BLEND);gl.blendEquation(gl.MAX);gl.blendFunc(gl.ONE,gl.ONE);gl.clearColor(0,0,0,0);return true;}
    catch(e){gpuError=String(e&&e.message||e);console.warn('WebGL2 unavailable; retaining Canvas 2D renderer:',e);gpuCanvas.style.display='none';return false;}
  }
  const gpuEnabled=initGpu();
  function uploadGpuGeometry(g){
    if(!gpuEnabled)return;
    const segments=[];
    const pushVertex=(ia,ib,side,end)=>{
      const a=ia*2,b=ib*2;
      const vals=[g.x[ia],g.y[ia],g.sinA[ia],g.cosA[ia],g.sinB[ia],g.cosB[ia],g.sinC[ia],g.cosC[ia],g.sinD[ia],g.cosD[ia],g.sinE[ia],g.cosE[ia],
        g.x[ib],g.y[ib],g.sinA[ib],g.cosA[ib],g.sinB[ib],g.cosB[ib],g.sinC[ib],g.cosC[ib],g.sinD[ib],g.cosD[ib],g.sinE[ib],g.cosE[ib],side,end];
      for(let k=0;k<vals.length;k++)segments.push(vals[k]);
    };
    for(let line=0;line<g.starts.length;line++){
      const from=g.starts[line],to=line+1<g.starts.length?g.starts[line+1]:g.x.length;
      for(let i=from;i<to-1;i++){
        pushVertex(i,i+1,-1,0);pushVertex(i,i+1,1,0);pushVertex(i,i+1,-1,1);
        pushVertex(i,i+1,-1,1);pushVertex(i,i+1,1,0);pushVertex(i,i+1,1,1);
      }
    }
    const data=new Float32Array(segments);
    gpuIndexCount=data.length/26;
    gl.bindBuffer(gl.ARRAY_BUFFER,gpuVertexBuffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
    const stride=26*4;
    const attrs=[[0,2,0],[1,2,2],[2,2,4],[3,2,6],[4,2,8],[5,2,10],[6,2,12],[7,2,14],[8,2,16],[9,2,18],[10,2,20],[11,2,22],[12,1,24],[13,1,25]];
    for(const [loc,size,offset] of attrs){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,offset*4);}
  }
  function drawGpu(t){
    if(!gpuEnabled)return;
    gl.viewport(0,0,gpuCanvas.width,gpuCanvas.height);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(gpuProgram);
    gl.uniform2f(gl.getUniformLocation(gpuProgram,'u_resolution'),width,height);
    gl.uniform1f(gl.getUniformLocation(gpuProgram,'u_inv2Sigma2'),inv2Sigma2);
    gl.uniform1f(gl.getUniformLocation(gpuProgram,'u_rayMargin'),rayMargin);
    gl.uniform1f(gl.getUniformLocation(gpuProgram,'u_softening'),9.0);
    const xy=new Float32Array(20),rS=new Float32Array(10);let count=0;
    for(const p of fields){if(count>=MAX_GPU_POINTERS)break;xy[count*2]=p.x;xy[count*2+1]=p.y;rS[count]=2.2*Math.max(0,Math.min(1,p.strength));count++;}
    gl.uniform1i(gl.getUniformLocation(gpuProgram,'u_pointerCount'),count);
    gl.uniform2fv(gl.getUniformLocation(gpuProgram,'u_pointer[0]'),xy);
    gl.uniform1fv(gl.getUniformLocation(gpuProgram,'u_rS[0]'),rS);
    const rates=[.00105,.00072,.00092,.00066,.00045],phases=new Float32Array(10);for(let i=0;i<5;i++){phases[2*i]=Math.sin(t*rates[i]);phases[2*i+1]=Math.cos(t*rates[i]);}
    gl.uniform2fv(gl.getUniformLocation(gpuProgram,'u_phase[0]'),phases);
    gl.bindBuffer(gl.ARRAY_BUFFER,gpuVertexBuffer);
    gl.drawArrays(gl.TRIANGLES,0,gpuIndexCount);
  }

  const smooth = (a,b,t) => a+(b-a)*t;

  starfield.decoding = 'async';
  starfield.fetchPriority = 'low';
  starfield.src = 'https://assets.science.nasa.gov/dynamicimage/assets/science/missions/hubble/releases/2012/11/STScI-01EVSKKXBHFJX27QM0284AZ7GZ.jpg?fit=crop&w=1600&h=900';
  starfield.onload = () => {
    imageStatus='loaded'; perf.imageLoad=performance.now()-perf.imageStart;
    const entry=performance.getEntriesByName(starfield.currentSrc || starfield.src).at(-1);
    perf.imageBytes=entry && entry.transferSize ? entry.transferSize : null;
    rebuildBackground();
  };
  starfield.onerror = () => { imageStatus='failed'; perf.imageLoad=performance.now()-perf.imageStart; };

  function buildGeometry() {
    const step=spacing(), sampleStep=0.5, margin=step*2, xs=[], ys=[], starts=[];
    for(let x=-margin;x<=width+margin;x+=step){
      starts.push(xs.length);
      for(let y=-margin;y<=height+margin;y+=sampleStep){xs.push(x);ys.push(y);}
    }
    for(let y=-margin;y<=height+margin;y+=step){
      starts.push(xs.length);
      for(let x=-margin;x<=width+margin;x+=sampleStep){xs.push(x);ys.push(y);}
    }
    const xLineCount=starts.length;
    const n=xs.length, x=new Float32Array(xs), y=new Float32Array(ys);
    const sinA=new Float32Array(n),cosA=new Float32Array(n);
    const sinB=new Float32Array(n),cosB=new Float32Array(n);
    const sinC=new Float32Array(n),cosC=new Float32Array(n);
    const sinD=new Float32Array(n),cosD=new Float32Array(n);
    const sinE=new Float32Array(n),cosE=new Float32Array(n);
    for(let i=0;i<n;i++){
      let a=y[i]*.017,b=(x[i]+y[i])*.008,c=x[i]*.016,d=(x[i]-y[i])*.009,e=x[i]*.002+y[i]*.0015;
      sinA[i]=Math.sin(a);cosA[i]=Math.cos(a);
      sinB[i]=Math.sin(b);cosB[i]=Math.cos(b);
      sinC[i]=Math.sin(c);cosC[i]=Math.cos(c);
      sinD[i]=Math.sin(d);cosD[i]=Math.cos(d);
      sinE[i]=Math.sin(e);cosE[i]=Math.cos(e);
    }
    geometry={x,y,starts:new Uint32Array(starts),xLineCount,sinA,cosA,sinB,cosB,sinC,cosC,sinD,cosD,sinE,cosE};
    uploadGpuGeometry(geometry);
  }
  function rebuildBackground(){

    if(benchMode){let touchPointers=0,downPointers=0;for(const p of pointers.values()){if(p.down){downPointers++;if(p.pointerType==='touch')touchPointers++;}}perf.frameLog.push({t:+(now-perf.started).toFixed(1),intervalMs:+frameDelta.toFixed(2),renderCpuMs:+renderCost.toFixed(2),activePointers:pointers.size,downPointers,touchPointers,dpr,frameCapHz:frameCap});if(perf.frameLog.length>18000)perf.frameLog.shift();}
    if(benchMode&&now-perf.lastReport>1000){perf.lastReport=now;const r=report();reportText.textContent=
      `Renderer ${gpuEnabled?'WebGL 2':'Canvas 2D fallback'}${gpuError?' · '+gpuError:''}\nSession ${r.session.seconds}s · ${r.session.observedFps} FPS · ${r.session.frames} frames\nGrid vertices ${r.interaction.gridVertices}\nFrame interval p50/p95/p99 ${r.frameIntervalMs.p50}/${r.frameIntervalMs.p95}/${r.frameIntervalMs.p99} ms\nRender CPU mean/p95 ${r.renderCpuMs.mean}/${r.renderCpuMs.p95} ms\nMissed-frame estimate ${r.session.estimatedDroppedFrames} · baseline ${r.session.baselineFrameIntervalMs??'calibrating'} ms\nImage ${r.startup.backgroundImage} · ${r.startup.imageLoadMs??'…'} ms\nLong tasks ${r.session.longTasks}\nDPR ${r.device.effectiveDpr} · pointers ${r.interaction.activePointers}`;
    }
    raf=0;if(!document.hidden)raf=requestAnimationFrame(render);
  }
  function start(){if(!document.hidden&&!raf)raf=requestAnimationFrame(render);}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){persistentMasses.length=0;if(raf)cancelAnimationFrame(raf);raf=0;last=0;lastFrame=0;}else start();});
  reducedMotion.addEventListener?.('change',start);
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  start();
  hintTimer=setTimeout(()=>hint.classList.add('hidden'),6500);
})();
</script>
