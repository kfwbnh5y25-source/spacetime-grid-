<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Spacetime — Interactive Grid</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .hint {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%); color: rgba(255,255,255,.42);
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .22em; text-transform: uppercase; white-space: nowrap;
    pointer-events: none; transition: opacity 1.2s ease;
  }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="universe" aria-label="Interactive curved spacetime grid. Move or touch to bend the grid."></canvas>
<div class="hint" id="hint">move · touch · explore</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const hint = document.getElementById('hint');
  const pointers = new Map();
  const fields = [];
  const starfield = new Image();
  const background = document.createElement('canvas');
  const bgctx = background.getContext('2d', { alpha: false });
  const benchMode = new URLSearchParams(location.search).has('bench');
  const perf = {
    started: performance.now(), firstFrame: null, imageStart: performance.now(),
    imageLoad: null, imageBytes: null, samples: [], dropped: 0, frames: 0,
    renderMs: [], lastReport: 0, longTasks: 0, maxFrameMs: 0
  };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const gaussian = new Float32Array(2049);
  for (let i = 0; i < gaussian.length; i++) gaussian[i] = Math.exp(-i * 8 / (gaussian.length - 1));
  let width=0, height=0, dpr=1, last=0, elapsed=0, hintTimer, raf=0, lastFrame=0;
  let inv2Sigma2=0, geometry=null, imageStatus='loading';
  const spacing = () => Math.max(30, Math.min(48, Math.round(Math.min(width,height)/17)));
  const smooth = (a,b,t) => a+(b-a)*t;

  starfield.decoding = 'async';
  starfield.fetchPriority = 'low';
  starfield.src = 'https://assets.science.nasa.gov/dynamicimage/assets/science/missions/hubble/releases/2012/11/STScI-01EVSKKXBHFJX27QM0284AZ7GZ.jpg?fit=crop&w=1600&h=900';
  starfield.onload = () => {
    imageStatus='loaded'; perf.imageLoad=performance.now()-perf.imageStart;
    const entry=performance.getEntriesByName(starfield.currentSrc || starfield.src).at(-1);
    perf.imageBytes=entry && entry.transferSize ? entry.transferSize : null;
    rebuildBackground();
  };
  starfield.onerror = () => { imageStatus='failed'; perf.imageLoad=performance.now()-perf.imageStart; };

  function buildGeometry() {
    const step=spacing(), margin=step*2, xs=[], ys=[], starts=[];
    for(let x=-margin;x<=width+margin;x+=step){
      starts.push(xs.length);
      for(let y=-margin;y<=height+margin;y+=8){xs.push(x);ys.push(y);}
    }
    for(let y=-margin;y<=height+margin;y+=step){
      starts.push(xs.length);
      for(let x=-margin;x<=width+margin;x+=8){xs.push(x);ys.push(y);}
    }
    const n=xs.length, x=new Float32Array(xs), y=new Float32Array(ys);
    const sinA=new Float32Array(n),cosA=new Float32Array(n);
    const sinB=new Float32Array(n),cosB=new Float32Array(n);
    const sinC=new Float32Array(n),cosC=new Float32Array(n);
    const sinD=new Float32Array(n),cosD=new Float32Array(n);
    const sinE=new Float32Array(n),cosE=new Float32Array(n);
    for(let i=0;i<n;i++){
      let a=y[i]*.017,b=(x[i]+y[i])*.008,c=x[i]*.016,d=(x[i]-y[i])*.009,e=x[i]*.002+y[i]*.0015;
      sinA[i]=Math.sin(a);cosA[i]=Math.cos(a);
      sinB[i]=Math.sin(b);cosB[i]=Math.cos(b);
      sinC[i]=Math.sin(c);cosC[i]=Math.cos(c);
      sinD[i]=Math.sin(d);cosD[i]=Math.cos(d);
      sinE[i]=Math.sin(e);cosE[i]=Math.cos(e);
    }
    geometry={x,y,starts:new Uint32Array(starts),sinA,cosA,sinB,cosB,sinC,cosC,sinD,cosD,sinE,cosE};
  }
  function rebuildBackground(){
    background.width=Math.max(1,Math.round(width*dpr));
    background.height=Math.max(1,Math.round(height*dpr));
    bgctx.setTransform(dpr,0,0,dpr,0,0);
    bgctx.fillStyle='#000';bgctx.fillRect(0,0,width,height);
    if(imageStatus!=='loaded'||!starfield.naturalWidth)return;
    const scale=Math.max(width/starfield.naturalWidth,height/starfield.naturalHeight);
    const sw=starfield.naturalWidth*scale,sh=starfield.naturalHeight*scale;
    bgctx.globalAlpha=.34;bgctx.drawImage(starfield,(width-sw)/2,(height-sh)/2,sw,sh);
    bgctx.globalAlpha=1;bgctx.fillStyle='rgba(0,0,0,.58)';bgctx.fillRect(0,0,width,height);
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.75);
    width=window.innerWidth;height=window.innerHeight;
    const sigma=Math.min(width,height)*.19;inv2Sigma2=1/(2*sigma*sigma);
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildGeometry();rebuildBackground();
  }
  window.addEventListener('resize',resize,{passive:true});resize();

  function pointerDown(e){
    e.preventDefault();canvas.setPointerCapture?.(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,tx:e.clientX,ty:e.clientY,strength:1,life:1,down:true});
    hint.classList.add('hidden');clearTimeout(hintTimer);
  }
  function pointerMove(e){
    const p=pointers.get(e.pointerId);
    if(p){p.tx=e.clientX;p.ty=e.clientY;}
    else if(e.pointerType==='mouse')pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,tx:e.clientX,ty:e.clientY,strength:.72,life:1,hover:true});
  }
  function pointerEnd(e){const p=pointers.get(e.pointerId);if(p){p.life=0;p.down=false;}}
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('pointerdown',pointerDown,{passive:false});
  canvas.addEventListener('pointermove',pointerMove,{passive:true});
  canvas.addEventListener('pointerup',pointerEnd);
  canvas.addEventListener('pointercancel',pointerEnd);
  canvas.addEventListener('lostpointercapture',pointerEnd);
  canvas.addEventListener('pointerleave',e=>{const p=pointers.get(e.pointerId);if(p&&p.hover)p.life=0;});

  function warpVertex(g,i,times){
    const x=g.x[i],y=g.y[i];let ox=x,oy=y;
    for(let j=0;j<fields.length;j++){
      const p=fields[j],dx=p.x-x,dy=p.y-y,r2=dx*dx+dy*dy+1;
      const q=Math.min(1,r2*inv2Sigma2*gaussian.length/8);
      const qi=q*(gaussian.length-1),lo=qi|0;
      const influence=gaussian[lo]+(gaussian[Math.min(lo+1,gaussian.length-1)]-gaussian[lo])*(qi-lo);
      const bend=55*p.strength*p.life*influence, invR=1/Math.sqrt(r2);
      ox-=dx*invR*bend;oy-=dy*invR*bend;
    }
    const [s1,c1,s2,c2,s3,c3,s4,c4,s5,c5]=times;
    const waveX=2*(g.sinA[i]*c1+g.cosA[i]*s1)+(g.sinB[i]*c2-g.cosB[i]*s2);
    const waveY=2*(g.sinC[i]*c3-g.cosC[i]*s3)+(g.sinD[i]*c4+g.cosD[i]*s4);
    const breathe=.45*(g.sinE[i]*c5+g.cosE[i]*s5);
    return [ox+waveX,oy+waveY+breathe];
  }
  function percentile(a,p){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor((s.length-1)*p))];}
  function report(){
    const samples=perf.samples, frames=perf.frames, avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
    const data={
      device:{userAgent:navigator.userAgent,screen:`${screen.width}x${screen.height}`,viewport:`${innerWidth}x${innerHeight}`,dpr:devicePixelRatio,effectiveDpr:dpr,hardwareConcurrency:navigator.hardwareConcurrency||null},
      session:{seconds:Math.round((performance.now()-perf.started)/1000),frames,estimatedDroppedFrames:perf.dropped,longTasks:perf.longTasks},
      frameIntervalMs:{p50:+percentile(samples,.5).toFixed(2),p95:+percentile(samples,.95).toFixed(2),p99:+percentile(samples,.99).toFixed(2),max:+perf.maxFrameMs.toFixed(2)},
      renderCpuMs:{mean:+avg(perf.renderMs).toFixed(2),p95:+percentile(perf.renderMs,.95).toFixed(2)},
      startup:{firstFrameMs:perf.firstFrame===null?null:+(perf.firstFrame-perf.started).toFixed(1),backgroundImage:imageStatus,imageLoadMs:perf.imageLoad===null?null:+perf.imageLoad.toFixed(1),imageTransferBytes:perf.imageBytes},
      interaction:{activePointers:pointers.size,gridVertices:geometry?geometry.x.length:0,reducedMotion:reducedMotion.matches},
      note:'Browser-side estimates only. Safari does not expose device thermal state or exact compositor/GPU dropped-frame counts.'
    };
    return data;
  }
  let panel,reportText;
  if(benchMode){
    panel=document.createElement('section');
    panel.style.cssText='position:fixed;z-index:5;top:12px;left:12px;max-width:min(360px,calc(100vw - 24px));max-height:48vh;overflow:auto;padding:12px 14px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.22);color:#e8edf7;font:11px/1.5 ui-monospace,monospace;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:pan-y;user-select:text;-webkit-user-select:text';
    panel.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b>DEVICE BENCHMARK</b><button id="saveBench" style="background:#fff;color:#000;border:0;padding:6px 9px;font:inherit">Export JSON</button></div><pre id="benchText" style="white-space:pre-wrap;margin:8px 0 0"></pre><p style="color:#aab4c5;margin:8px 0 0">Run 2 min idle, 2 min continuous dragging, then 30 s with 2–5 fingers. Keep this tab foregrounded. Thermal state is not exposed by Safari.</p>';
    document.body.appendChild(panel);reportText=panel.querySelector('#benchText');
    panel.querySelector('#saveBench').addEventListener('click',()=>{
      const blob=new Blob([JSON.stringify(report(),null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='spacetime-iphone-benchmark.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
    if('PerformanceObserver'in window){
      try{new PerformanceObserver(list=>{perf.longTasks+=list.getEntries().length;}).observe({type:'longtask',buffered:true});}catch(_){}
    }
  }

  function render(now){
    const hasTouch=[...pointers.values()].some(p=>p.down);
    const targetHz=hasTouch?120:60,frameInterval=1000/targetHz;
    if(lastFrame&&now-lastFrame<frameInterval-1){raf=requestAnimationFrame(render);return;}
    const frameDelta=lastFrame?now-lastFrame:0;
    if(frameDelta){perf.samples.push(frameDelta);if(perf.samples.length>1800)perf.samples.shift();if(frameDelta>frameInterval*1.5)perf.dropped++;perf.frames++;perf.maxFrameMs=Math.max(perf.maxFrameMs,frameDelta);}
    const renderStart=performance.now();
    const dt=Math.min(40,now-(last||now));last=now;lastFrame=now;elapsed+=dt;
    if(perf.firstFrame===null)perf.firstFrame=now;
    const t=reducedMotion.matches?0:elapsed;
    ctx.drawImage(background,0,0,width,height);
    fields.length=0;
    for(const [id,p] of pointers){
      p.x=smooth(p.x,p.tx,.22);p.y=smooth(p.y,p.ty,.22);
      if(p.life<=0)p.strength*=.985;
      if(p.life<=0&&p.strength<.025){pointers.delete(id);continue;}
      fields.push(p);
    }
    const g=geometry;
    const times=[Math.sin(t*.00105),Math.cos(t*.00105),Math.sin(t*.00072),Math.cos(t*.00072),
      Math.sin(t*.00092),Math.cos(t*.00092),Math.sin(t*.00066),Math.cos(t*.00066),
      Math.sin(t*.00045),Math.cos(t*.00045)];
    ctx.lineWidth=.75;ctx.strokeStyle='rgba(235,242,255,.29)';ctx.beginPath();
    for(let line=0;line<g.starts.length;line++){
      const from=g.starts[line],to=line+1<g.starts.length?g.starts[line+1]:g.x.length;
      for(let i=from;i<to;i++){
        const v=warpVertex(g,i,times);
        if(i===from)ctx.moveTo(v[0],v[1]);else ctx.lineTo(v[0],v[1]);
      }
    }
    ctx.stroke();
    for(const p of fields){
      const radius=110,glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);
      glow.addColorStop(0,'rgba(190,215,255,'+(.075*p.strength)+')');
      glow.addColorStop(1,'rgba(190,215,255,0)');
      ctx.fillStyle=glow;ctx.fillRect(p.x-radius,p.y-radius,radius*2,radius*2);
    }
    perf.renderMs.push(performance.now()-renderStart);if(perf.renderMs.length>1800)perf.renderMs.shift();
    if(benchMode&&now-perf.lastReport>500){perf.lastReport=now;const r=report();reportText.textContent=
      `Session ${r.session.seconds}s · ${r.session.frames} frames\nGrid vertices ${r.interaction.gridVertices}\nFrame interval p50/p95/p99 ${r.frameIntervalMs.p50}/${r.frameIntervalMs.p95}/${r.frameIntervalMs.p99} ms\nRender CPU mean/p95 ${r.renderCpuMs.mean}/${r.renderCpuMs.p95} ms\nDropped-frame estimate ${r.session.estimatedDroppedFrames}\nImage ${r.startup.backgroundImage} · ${r.startup.imageLoadMs??'…'} ms\nLong tasks ${r.session.longTasks}\nDPR ${r.device.effectiveDpr} · pointers ${r.interaction.activePointers}`;
    }
    raf=0;if(!document.hidden)raf=requestAnimationFrame(render);
  }
  function start(){if(!document.hidden&&!raf)raf=requestAnimationFrame(render);}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;last=0;lastFrame=0;}else start();});
  reducedMotion.addEventListener?.('change',start);
  start();
  hintTimer=setTimeout(()=>hint.classList.add('hidden'),6500);
})();
</script>
</body>
</html>
