<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #000; }
  body { touch-action: none; }
  canvas {
    display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gpuCanvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #trajectoryCanvas { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .planet-cursor { position:fixed; z-index:4; left:0; top:0; width:18px; height:18px; border-radius:50%; pointer-events:none; opacity:0; will-change:transform; background:radial-gradient(circle at 32% 27%,#fff 0%,#b9d9ff 13%,#547da9 43%,#182d49 76%,#080f1b 100%); box-shadow:0 0 7px 2px rgba(154,202,255,.35),inset -3px -2px 5px rgba(0,0,0,.65); transition:opacity .12s ease; }
  .planet-cursor::after { content:""; position:absolute; width:27px; height:8px; left:-5px; top:5px; border:1px solid rgba(190,220,255,.8); border-radius:50%; transform:rotate(-24deg); box-shadow:0 0 4px rgba(150,200,255,.45); }
  .planet-cursor.visible { opacity:1; }
  canvas { transform-origin:50% 50%; will-change:transform; backface-visibility:hidden; }
  #gestureStatus { position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 10px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.72);font:10px/1.3 ui-monospace,monospace;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s; }
  #gestureStatus.visible { opacity:1; }
  #resetViewButton { display:none; }
  #planetCursor[hidden], #gestureStatus[hidden], #gyroButton[hidden] { display:none !important; }
  @media (pointer:coarse) {
    #resetViewButton { display:flex; position:fixed; z-index:6; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right)); align-items:center; justify-content:center; width:42px; height:42px; padding:0; border:1px solid rgba(255,255,255,.24); border-radius:50%; background:rgba(8,12,20,.62); color:rgba(245,248,255,.9); font:24px/1 system-ui,sans-serif; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    #resetViewButton:active { background:rgba(120,150,195,.35); transform:scale(.94); }
  }
  #gyroButton { display:none; }
  @media (pointer:coarse) {
    #gyroButton { display:flex; position:fixed; z-index:6; top:max(14px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); align-items:center; justify-content:center; min-width:42px; height:42px; padding:0 12px; border:1px solid rgba(255,255,255,.24); border-radius:22px; background:rgba(8,12,20,.62); color:rgba(245,248,255,.9); font:11px/1 system-ui,sans-serif; letter-spacing:.04em; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    #gyroButton.active { border-color:rgba(160,205,255,.75); background:rgba(50,85,130,.58); }
  }
  @media (prefers-reduced-motion: reduce) { .planet-cursor,.hint,#gestureStatus { transition:none; } }
  @media (hover:hover) and (pointer:fine) { canvas { cursor:none; } }
  #simHud { position:fixed;z-index:7;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:rgba(235,243,255,.65);font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-align:center;white-space:nowrap;pointer-events:none; }
  #simReadout { display:flex;gap:14px;justify-content:flex-end;padding:8px 10px;border:1px solid rgba(210,225,255,.18);border-radius:12px;background:rgba(4,9,18,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px); }
  #simReadout b { color:#fff;font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums; }
  #simControls { width:min(310px,calc(100vw - 28px));margin-top:7px;margin-left:auto;border:1px solid rgba(210,225,255,.18);border-radius:13px;background:rgba(4,9,18,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px); }
  #simControls summary { list-style:none;cursor:pointer;padding:9px 11px;color:rgba(235,243,255,.76);letter-spacing:.16em;font-size:9px; }
  #simControls summary::-webkit-details-marker { display:none; }
  #simControls[open] summary { border-bottom:1px solid rgba(210,225,255,.12); }
  .simControlsBody { padding:10px 11px 11px;display:grid;gap:10px; }
  .simButtons { display:flex;gap:6px;flex-wrap:wrap; }
  .simButtons button,.simControlsBody select { min-height:30px;border:1px solid rgba(215,230,255,.2);border-radius:7px;background:rgba(130,160,205,.12);color:#edf4ff;padding:5px 8px;font:10px ui-monospace,monospace;letter-spacing:.04em; }
  .simControlsBody select { width:100%; }
  .simSlider { display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;color:rgba(230,239,255,.7);font-size:9px;letter-spacing:.1em; }
  .simSlider output { color:#fff;font-variant-numeric:tabular-nums; }
  .simSlider input { grid-column:1 / -1;width:100%;accent-color:#a9cfff;height:16px;margin:0; }
  #simControls .simHelp { margin:0;color:rgba(225,236,255,.42);font-size:9px;line-height:1.5;letter-spacing:.03em; }
  @media (pointer:coarse) { #simHud { top:max(66px,calc(env(safe-area-inset-top) + 58px));right:10px; } #simReadout { gap:9px;padding:7px 8px; } #simControls { width:min(280px,calc(100vw - 20px)); } }
  .hint {
    position: fixed; z-index: 3; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%); color: rgba(255,255,255,.42);
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .22em; text-transform: uppercase; white-space: nowrap;
    pointer-events: none; transition: opacity 1.2s ease;
  }
  .hint.hidden { opacity: 0; }
  #orbitTutorialBtn { position:fixed; z-index:8; left:max(14px,env(safe-area-inset-left)); bottom:max(16px,env(safe-area-inset-bottom)); display:flex; align-items:center; gap:6px; min-height:36px; padding:0 13px; border:1px solid rgba(190,220,255,.28); border-radius:20px; background:rgba(6,12,24,.72); color:rgba(235,245,255,.92); font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; cursor:pointer; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); touch-action:manipulation; -webkit-tap-highlight-color:transparent; transition:background .18s,border-color .18s,opacity .2s; }
  #orbitTutorialBtn:hover { background:rgba(30,54,90,.78); border-color:rgba(165,210,255,.55); }
  #orbitTutorialBtn.hidden { opacity:0; pointer-events:none; }
  #orbitTutorial { position:fixed; z-index:9; left:max(14px,env(safe-area-inset-left)); bottom:max(16px,env(safe-area-inset-bottom)); width:min(340px,calc(100vw - 28px)); padding:14px 15px; border:1px solid rgba(185,218,255,.24); border-radius:16px; background:rgba(5,10,20,.84); color:#ebf3ff; font:12px/1.45 system-ui,-apple-system,sans-serif; -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 14px 36px rgba(0,0,0,.55); touch-action:manipulation; }
  #orbitTutorial[hidden] { display:none; }
  .tutHeader { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .tutStepTag { font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em; color:#8ec5ff; text-transform:uppercase; }
  .tutClose { width:26px; height:26px; border:1px solid rgba(255,255,255,.16); border-radius:50%; background:rgba(255,255,255,.06); color:rgba(235,243,255,.8); font:14px/1 system-ui,sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .tutPills { display:flex; gap:5px; margin-bottom:10px; }
  .tutPill { flex:1; height:4px; border-radius:99px; background:rgba(255,255,255,.14); transition:background .2s; }
  .tutPill.done { background:#63d297; }
  .tutPill.active { background:#8ec5ff; }
  .tutTitle { margin:0 0 5px; font-size:14px; font-weight:600; color:#fff; letter-spacing:-.01em; }
  .tutBody { margin:0 0 11px; font-size:12px; color:rgba(225,236,255,.82); }
  .tutFormula { display:inline-block; margin-top:4px; padding:2px 7px; border-radius:6px; background:rgba(130,185,255,.12); border:1px solid rgba(130,185,255,.22); font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9dcff; }
  .tutActions { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .tutBtnGroup { display:flex; gap:6px; }
  .tutBtn { min-height:30px; padding:5px 11px; border:1px solid rgba(190,220,255,.24); border-radius:8px; background:rgba(120,165,225,.14); color:#eef5ff; font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em; cursor:pointer; }
  .tutBtn.primary { background:rgba(110,175,255,.32); border-color:rgba(165,215,255,.55); color:#fff; }
  .tutBtn:active { transform:scale(.97); }
  @media (pointer:coarse) {
    #orbitTutorial { left:50%; transform:translateX(-50%); width:min(360px,calc(100vw - 24px)); }
  }
  #spinWavesBtn { position:fixed; z-index:8; right:max(14px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); display:flex; align-items:center; gap:6px; min-height:36px; padding:0 13px; border:1px solid rgba(190,220,255,.28); border-radius:20px; background:rgba(6,12,24,.72); color:rgba(235,245,255,.92); font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; text-decoration:none; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); touch-action:manipulation; -webkit-tap-highlight-color:transparent; transition:background .18s,border-color .18s; }
  #spinWavesBtn:hover { background:rgba(30,54,90,.78); border-color:rgba(165,210,255,.55); }
</style>

<body>
<canvas id="universe" aria-label="Interactive spatial geometry. Tap once to place one stationary mass."></canvas>
<canvas id="gpuCanvas" aria-hidden="true"></canvas>
<canvas id="trajectoryCanvas" aria-hidden="true"></canvas>
<div class="hint" id="hint">tap · place one stationary mass</div>
<div class="planet-cursor" id="planetCursor" hidden aria-hidden="true"></div>
<div id="gestureStatus" hidden aria-live="polite"></div>
<button id="gyroButton" hidden type="button" aria-pressed="false"></button>
<button id="resetViewButton" type="button" aria-label="Reset simulation" title="Reset simulation">↺</button>
<div id="simHud" aria-live="polite">EMPTY SPACE · TAP TO CREATE A MASS</div>
<button id="orbitTutorialBtn" type="button" aria-label="Open orbital trajectories tutorial">ORBITS ?</button>
<a id="spinWavesBtn" href="./spin-waves/" aria-label="Open Spin Wave Eigenmodes and Parametric Excitation simulation">SPIN WAVES →</a>
<section id="orbitTutorial" hidden aria-label="Orbital trajectories tutorial">
  <div class="tutHeader">
    <span class="tutStepTag" id="tutStepTag">STEP 1 OF 4</span>
    <button class="tutClose" id="tutClose" type="button" aria-label="Close tutorial">×</button>
  </div>
  <div class="tutPills" aria-hidden="true">
    <div class="tutPill" data-step="0"></div>
    <div class="tutPill" data-step="1"></div>
    <div class="tutPill" data-step="2"></div>
    <div class="tutPill" data-step="3"></div>
  </div>
  <h2 class="tutTitle" id="tutTitle"></h2>
  <p class="tutBody" id="tutBody"></p>
  <div class="tutActions">
    <div class="tutBtnGroup">
      <button class="tutBtn primary" id="tutDemo" type="button">Watch Demo</button>
      <button class="tutBtn" id="tutReset" type="button">Reset</button>
    </div>
    <div class="tutBtnGroup">
      <button class="tutBtn" id="tutPrev" type="button">Back</button>
      <button class="tutBtn" id="tutNext" type="button">Next</button>
    </div>
  </div>
</section>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const gpuCanvas=document.getElementById('gpuCanvas');
  const trajectoryCanvas=document.getElementById('trajectoryCanvas');
  const trajectoryCtx=trajectoryCanvas.getContext('2d',{alpha:true,desynchronized:true});
  const gl=gpuCanvas.getContext('webgl2',{alpha:true,antialias:true,desynchronized:true,powerPreference:'high-performance'});
  let gpuProgram=null,gpuVertexBuffer=null,gpuIndexBuffer=null,gpuIndexCount=0,gpuError=null;
  const MAX_GPU_POINTERS=24;
  const hint = document.getElementById('hint');
  const planetCursor = document.getElementById('planetCursor');
  const gestureStatus=document.getElementById('gestureStatus');
  const persistentMasses=[];
  let gravityG=3,newMassValue=0.002,gravityEnabled=true,trailsEnabled=true;
  let mouseWorld={x:innerWidth/2,y:innerHeight/2},mousePan=null,launchDrag=null;
  let viewScale=1,viewX=0,viewY=0,viewRotation=0,camComX=innerWidth/2,camComY=innerHeight/2,paused=false,pauseTime=0,longPressTimer=0,longPressPointer=null,adaptiveDprCap=matchMedia('(pointer:coarse)').matches?1:1.5,slowFrames=0,smoothFrames=0;
  const storageKey='spacetime-grid-state-v1';
  let cameraAnimationRaf=0,cameraAnimationTarget=null,cameraAnimationLast=0;
  function worldPoint(x,y){
    const dx=x-width/2-viewX,dy=y-height/2-viewY,a=viewRotation*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    return {x:camComX+(dx*c+dy*sn)/viewScale,y:camComY+(-dx*sn+dy*c)/viewScale};
  }
  function screenPoint(wx,wy){
    const dx=(wx-camComX)*viewScale,dy=(wy-camComY)*viewScale,a=viewRotation*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    return {x:width/2+viewX+dx*c-dy*sn,y:height/2+viewY+dx*sn+dy*c};
  }
  function applyView(){sceneDirty=true;}
  function stopCameraAnimation(){if(cameraAnimationRaf)cancelAnimationFrame(cameraAnimationRaf);cameraAnimationRaf=0;cameraAnimationTarget=null;cameraAnimationLast=0;}
  function animateCameraTo(target){
    cameraAnimationTarget={viewX:target.viewX,viewY:target.viewY,viewScale:target.viewScale,viewRotation:target.viewRotation};
    if(cameraAnimationRaf)return;
    cameraAnimationLast=performance.now();
    const tick=now=>{
      const dt=Math.min(50,Math.max(1,now-cameraAnimationLast));cameraAnimationLast=now;
      const t=cameraAnimationTarget;
      if(!t){cameraAnimationRaf=0;return;}
      const blend=1-Math.exp(-dt/88);
      viewX+=(t.viewX-viewX)*blend;viewY+=(t.viewY-viewY)*blend;
      viewScale+=(t.viewScale-viewScale)*blend;viewRotation+=(t.viewRotation-viewRotation)*blend;
      const settled=Math.abs(t.viewX-viewX)<.08&&Math.abs(t.viewY-viewY)<.08&&
        Math.abs(t.viewScale-viewScale)<.0005&&Math.abs(t.viewRotation-viewRotation)<.015;
      if(settled){
        viewX=t.viewX;viewY=t.viewY;viewScale=t.viewScale;viewRotation=t.viewRotation;
        cameraAnimationRaf=0;cameraAnimationTarget=null;cameraAnimationLast=0;applyView();saveState();return;
      }
      applyView();cameraAnimationRaf=requestAnimationFrame(tick);
    };
    cameraAnimationRaf=requestAnimationFrame(tick);
  }
  function updateCameraTarget(patch){
    const base=cameraAnimationTarget||{viewX,viewY,viewScale,viewRotation};
    animateCameraTo({...base,...patch});
  }
  function showStatus(m){gestureStatus.textContent=m;gestureStatus.classList.add('visible');clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>gestureStatus.classList.remove('visible'),1300);}
  function saveState(){const state={viewScale,viewX,viewY,viewRotation};try{localStorage.setItem(storageKey,JSON.stringify(state));}catch(_){}try{const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(state))));history.replaceState(null,'',location.pathname+location.search+'#state='+encoded);}catch(_){}}
  function restoreState(){try{const hash=new URLSearchParams(location.hash.slice(1)).get('state');const d=hash?JSON.parse(decodeURIComponent(escape(atob(hash)))):JSON.parse(localStorage.getItem(storageKey)||'null');if(d){viewScale=Math.max(.45,Math.min(2.5,d.viewScale||1));viewX=Number(d.viewX)||0;viewY=Number(d.viewY)||0;viewRotation=Number(d.viewRotation)||0;}}catch(_){}}
  function resetView(){persistentMasses.length=0;launchDrag=null;camComX=width/2;camComY=height/2;sceneDirty=true;document.getElementById('simHud').textContent='EMPTY SPACE · TAP OR SLINGSHOT TO CREATE A MASS';updateCameraTarget({viewScale:1,viewX:0,viewY:0,viewRotation:0});showStatus('VIEW RESET');}
  const gyroButton=document.getElementById('gyroButton');
  let gyroEnabled=false,gyroBaseline=null,gyroTargetX=0,gyroTargetY=0,gyroX=0,gyroY=0,gyroListener=null;
  function handleDeviceOrientation(e){
    if(!gyroEnabled||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    if(!gyroBaseline){gyroBaseline={beta:e.beta,gamma:e.gamma};return;}
    const db=Math.max(-35,Math.min(35,e.beta-gyroBaseline.beta));
    const dg=Math.max(-35,Math.min(35,e.gamma-gyroBaseline.gamma));
    gyroTargetX=dg*2.2;
    gyroTargetY=db*2.2;
  }
  async function toggleGyro(){
    if(gyroEnabled){
      gyroEnabled=false;gyroBaseline=null;gyroTargetX=gyroTargetY=gyroX=gyroY=0;
      if(gyroListener)window.removeEventListener('deviceorientation',gyroListener);
      gyroListener=null;gyroButton.classList.remove('active');gyroButton.setAttribute('aria-pressed','false');gyroButton.textContent='TILT MASSES';showStatus('TILT CONTROL OFF');return;
    }
    try{
      const Orientation=window.DeviceOrientationEvent;
      if(!Orientation){showStatus('MOTION SENSOR UNAVAILABLE');return;}
      if(typeof Orientation.requestPermission==='function'){
        const permission=await Orientation.requestPermission();
        if(permission!=='granted'){showStatus('MOTION PERMISSION DENIED');return;}
      }
      gyroEnabled=true;gyroBaseline=null;gyroTargetX=gyroTargetY=gyroX=gyroY=0;
      gyroListener=handleDeviceOrientation;
      window.addEventListener('deviceorientation',gyroListener,{passive:true});
      gyroButton.classList.add('active');gyroButton.setAttribute('aria-pressed','true');gyroButton.textContent='TILT ON';
      showStatus('HOLD STILL TO CALIBRATE');
    }catch(_){showStatus('MOTION SENSOR UNAVAILABLE');}
  }
  gyroButton.addEventListener('click',toggleGyro);
  document.getElementById('resetViewButton').addEventListener('click',()=>{
    stopInertia();gestureBase=null;panBase=null;trackpadGestureBase=null;lastTouchSample=null;launchDrag=null;
    for(const [id,p] of pointers){if(p.pointerType==='touch'){p.life=0;p.targetStrength=0;p.down=false;}}
    resetView();
  });
  restoreState();
  const pointers = new Map();
  const fields = [];
  const starfield = new Image();
  const background = document.createElement('canvas');
  const bgctx = background.getContext('2d', { alpha: false });
  const benchMode = new URLSearchParams(location.search).has('bench');
  const benchParams = new URLSearchParams(location.search);
  let requestedDpr = [1,1.5,1.75,2,2.5,3].includes(Number(benchParams.get('dpr'))) ? Number(benchParams.get('dpr')) : 3;
  let frameCap = [60,120].includes(Number(benchParams.get('cap'))) ? Number(benchParams.get('cap')) : 120;
  let testLabel = benchParams.get('test') || 'unlabelled';
  const perf = {
    started: performance.now(), firstFrame: null, imageStart: performance.now(),
    imageLoad: null, imageBytes: null, samples: [], dropped: 0, baselineFrameMs: null, frames: 0,
    renderMs: [], lastReport: 0, longTasks: 0, maxFrameMs: 0, frameLog: []
  };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let width=0, height=0, dpr=1, last=0, elapsed=0, hintTimer, raf=0, lastFrame=0, lastCausalHudUpdate=0;
  let rayMargin=0, geometry=null, imageStatus='loading';
  let geodesicFrameOffsetX=0,geodesicFrameOffsetY=0;
  const spacing = () => Math.max(30, Math.min(48, Math.round(Math.min(width,height)/17)));

  // Explicit visualization calibration:
  // Raw Schwarzschild radius r_s = 2*(G*100)*M = 1.2 CSS px for M = 0.002,
  // which is sub-pixel at typical grid spacing (30-48 CSS px).
  // DISPLAY_SCHWARZSCHILD_SCALE amplifies r_s into a prominent, fold-free
  // educational display scale (r_s_display = 216 CSS px for default M = 0.002).
  // STATIC_WELL_PULL_PX < STATIC_WELL_SOFTENING_PX guarantees dr'/dr > 0 (no folding).
  const DISPLAY_SCHWARZSCHILD_SCALE = 180.0;
  const STATIC_WELL_PULL_PX = 42.0;
  const STATIC_WELL_SOFTENING_PX = 45.0;
  const CAUSAL_FRONT_WIDTH_PX = 28.0;
  const SLINGSHOT_SPEED_SCALE = 1.25;
  const N_BODY_MU_PER_MASS = 7.5e8;

  function gridCameraState(){
    const baseStep=spacing();
    const lodPow=Math.max(0,Math.ceil(-Math.log2(Math.max(.25,viewScale))-.45));
    const lodScale=Math.pow(2,lodPow);
    const lodStep=baseStep*lodScale;
    const center=worldPoint(width*.5,height*.5);
    const originX=Math.floor(center.x/lodStep)*lodStep;
    const originY=Math.floor(center.y/lodStep)*lodStep;
    return {baseStep,lodScale,lodStep,originX,originY};
  }

  function initGpu(){
    if(!gl)return false;
    const vs=`#version 300 es
precision highp float;
layout(location=0) in vec2 a_xy;
layout(location=1) in vec2 a_other;
layout(location=2) in float a_side;
layout(location=3) in float a_end;
uniform vec2 u_resolution;
uniform vec2 u_frameOffset;
uniform vec2 u_gridOrigin;
uniform float u_lodScale;
uniform vec2 u_camCom;
uniform vec2 u_viewOffset;
uniform float u_viewScale;
uniform vec2 u_viewCosSin;
uniform vec2 u_pointer[24];
uniform float u_rS[24];
uniform float u_createdAt[24];
uniform float u_time;

  function staticSchwarzschildDisplacement(x,y,t=elapsed,sourceList=fields){

  function geodesicDerivative(state,sourceList=fields,softening=1){

  function addState(a,b,k){return {x:a.x+k*b.x,y:a.y+k*b.y,vx:a.vx+k*b.vx,vy:a.vy+k*b.vy};}
  function rk4GeodesicStep(state,h,sourceList=fields,softening=1){

  function traceSpatialGeodesic(x,y,tx,ty,distance,options={}){
    const sourceList=options.sources??fields,softening=options.softening??1,tolerance=options.tolerance??.02,maxStep=options.maxStep??12,minStep=options.minStep??.25;

  function schwarzschildPsi(x,y,source){return 1+source.rS/(4*Math.hypot(x-source.x,y-source.y));}
  function geodesicInvariant(state,source){
    const factor=schwarzschildPsi(state.x,state.y,source)**4;

  function runGeodesicValidation(){
    const source={x:0,y:0,rS:40},radial=traceSpatialGeodesic(100,0,1,0,180,{sources:[source],softening:0,tolerance:.002,maxStep:8});
    const start={x:-180,y:90,vx:1,vy:0},initial=geodesicInvariant(start,source);
    const orbit=traceSpatialGeodesic(start.x,start.y,start.vx,start.vy,320,{sources:[source],softening:0,tolerance:.002,maxStep:8}),final=geodesicInvariant(orbit,source);
    const rel=(a,b)=>Math.abs(a-b)/Math.max(1e-12,Math.abs(a)),weakSource={x:0,y:0,rS:.5},impact=100,range=1000;

    });

    const point={x:120,y:70},r=Math.hypot(point.x,point.y),psi=schwarzschildPsi(point.x,point.y,source);

    const h=.001,psiXp=schwarzschildPsi(point.x+h,point.y,source),psiXm=schwarzschildPsi(point.x-h,point.y,source);

      relativeMetricSpeedDrift:rel(initial.energy,final.energy),relativeAngularMomentumDrift:rel(initial.angularMomentum,final.angularMomentum),
